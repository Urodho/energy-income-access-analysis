[project]
name = "kenya-energy-income"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "urodho", email = "urodhootieno@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
